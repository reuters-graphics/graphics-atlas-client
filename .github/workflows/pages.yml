name: Deploy demo to Pages

# Rebuilds docs/ (with a fresh client build) and republishes to the gh-pages
# branch on every push to master. Manual runs via workflow_dispatch too.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install (runs prepare -> builds dist)
        run: pnpm install --frozen-lockfile

      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site/docs _site/dist
          cp docs/index.html _site/docs/index.html
          cp dist/index.mjs dist/index.js _site/dist/
          touch _site/.nojekyll
          printf '<!doctype html><meta charset=utf-8><title>Graphics Atlas demo</title><meta http-equiv="refresh" content="0; url=./docs/">Redirecting to <a href="./docs/">the demo</a>.\n' > _site/index.html

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
