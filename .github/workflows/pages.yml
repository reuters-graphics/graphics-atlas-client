name: Deploy docs to Pages

# Builds the Starlight docs site (docs/) with a fresh client build and
# republishes it to the gh-pages branch on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      # Build the client so its dist/ exists for the docs' link: dependency.
      - name: Build client
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish to gh-pages
        run: |
          cd docs/dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy docs from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
